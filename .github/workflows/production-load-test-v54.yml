name: Business Zero v5.4 controlled load test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-load-test-v54.yml'

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for v5.4 deployment
        shell: bash
        run: |
          ok=0
          for i in {1..18}; do
            body=$(curl -fsS --max-time 20 https://business-zero-backend.onrender.com/health || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q 'business-zero-v5.4'; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "v5.4 was not deployed in time" >&2
            exit 1
          fi

      - name: Run controlled load test
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          const URL='https://business-zero-backend.onrender.com/health';
          const stages=[10,25,50,100,200,400,800];
          const secondsPerStage=12,timeoutMs=4000,maxErrorRate=.02,maxP95=1200;
          const report={url:URL,startedAt:new Date().toISOString(),secondsPerStage,stages:[]};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const pct=(arr,p)=>{if(!arr.length)return null;const a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.ceil((p/100)*a.length)-1)]};
          async function one(){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeoutMs),t0=performance.now();try{const res=await fetch(URL,{signal:c.signal,cache:'no-store',headers:{'User-Agent':'BusinessZero-v54-LoadTest/1.0'}});await res.arrayBuffer();return{ok:res.ok,status:res.status,ms:performance.now()-t0}}catch(e){return{ok:false,status:0,ms:performance.now()-t0,error:e.name||String(e)}}finally{clearTimeout(timer)}}
          async function stage(target){const all=[],started=performance.now();for(let s=0;s<secondsPerStage;s++){const b0=performance.now(),batch=await Promise.all(Array.from({length:target},one));all.push(...batch);const elapsed=performance.now()-b0;if(elapsed<1000)await sleep(1000-elapsed)}const duration=(performance.now()-started)/1000,good=all.filter(x=>x.ok),lat=good.map(x=>x.ms),failed=all.length-good.length;return{targetRps:target,requests:all.length,successful:good.length,failed,errorRate:failed/all.length,achievedRps:all.length/duration,avgMs:lat.reduce((a,b)=>a+b,0)/Math.max(1,lat.length),p50Ms:pct(lat,50),p95Ms:pct(lat,95),p99Ms:pct(lat,99),maxMs:lat.length?Math.max(...lat):null,statuses:all.reduce((m,x)=>(m[x.status]=(m[x.status]||0)+1,m),{})}}
          let stoppedEarly=false;for(const target of stages){console.log(`\n=== ${target} requested RPS for ${secondsPerStage}s ===`);const r=await stage(target);report.stages.push(r);console.log(JSON.stringify(r,null,2));if(r.errorRate>maxErrorRate||r.p95Ms==null||r.p95Ms>maxP95){stoppedEarly=true;console.log('STOP safety threshold');break}await sleep(2500)}
          report.finishedAt=new Date().toISOString();report.stoppedEarly=stoppedEarly;fs.writeFileSync('load-test-v54.json',JSON.stringify(report,null,2));
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-zero-load-test-v54
          path: load-test-v54.json
          if-no-files-found: warn
