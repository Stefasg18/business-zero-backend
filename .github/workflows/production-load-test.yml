name: Controlled production load test

on:
  push:
    paths:
      - '.github/workflows/production-load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Warm up service
        run: |
          for i in {1..6}; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 20 https://business-zero-backend.onrender.com/health || true)
            echo "warmup $i -> HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; break; fi
            sleep 10
          done

      - name: Run controlled load test
        id: load
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { performance } = require('perf_hooks');

          const URL = 'https://business-zero-backend.onrender.com/health';
          const stages = [10, 25, 50, 100, 200, 400];
          const secondsPerStage = 15;
          const timeoutMs = 4000;
          const maxErrorRate = 0.02;
          const maxP95 = 1200;
          const report = { url: URL, startedAt: new Date().toISOString(), secondsPerStage, stages: [] };

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const percentile = (arr, p) => {
            if (!arr.length) return null;
            const a = [...arr].sort((x,y)=>x-y);
            return a[Math.min(a.length - 1, Math.ceil((p/100) * a.length) - 1)];
          };

          async function oneRequest() {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            const t0 = performance.now();
            try {
              const res = await fetch(URL, { signal: controller.signal, cache: 'no-store', headers: { 'User-Agent': 'BusinessZero-Controlled-LoadTest/1.0' } });
              await res.arrayBuffer();
              return { ok: res.ok, status: res.status, ms: performance.now() - t0 };
            } catch (e) {
              return { ok: false, status: 0, ms: performance.now() - t0, error: e.name || String(e) };
            } finally {
              clearTimeout(timer);
            }
          }

          async function runStage(concurrency) {
            const all = [];
            const stageStart = performance.now();
            for (let s = 0; s < secondsPerStage; s++) {
              const batchStart = performance.now();
              const batch = await Promise.all(Array.from({ length: concurrency }, oneRequest));
              all.push(...batch);
              const elapsed = performance.now() - batchStart;
              if (elapsed < 1000) await sleep(1000 - elapsed);
            }
            const durationSec = (performance.now() - stageStart) / 1000;
            const ok = all.filter(x => x.ok);
            const fail = all.length - ok.length;
            const lat = ok.map(x => x.ms);
            const result = {
              concurrency,
              requests: all.length,
              successful: ok.length,
              failed: fail,
              errorRate: all.length ? fail / all.length : 1,
              achievedRps: all.length / durationSec,
              avgMs: lat.length ? lat.reduce((a,b)=>a+b,0)/lat.length : null,
              p50Ms: percentile(lat, 50),
              p95Ms: percentile(lat, 95),
              p99Ms: percentile(lat, 99),
              maxMs: lat.length ? Math.max(...lat) : null,
              statuses: all.reduce((m,x)=>(m[x.status]=(m[x.status]||0)+1,m),{})
            };
            return result;
          }

          let stoppedEarly = false;
          for (const c of stages) {
            console.log(`\n=== Stage ${c} concurrent requests/sec for ${secondsPerStage}s ===`);
            const r = await runStage(c);
            report.stages.push(r);
            console.log(JSON.stringify(r, null, 2));
            if (r.errorRate > maxErrorRate || r.p95Ms == null || r.p95Ms > maxP95) {
              console.log(`STOP: threshold exceeded (errorRate>${maxErrorRate} or p95>${maxP95}ms)`);
              stoppedEarly = true;
              break;
            }
            await sleep(3000);
          }

          report.finishedAt = new Date().toISOString();
          report.stoppedEarly = stoppedEarly;
          fs.writeFileSync('load-test-report.json', JSON.stringify(report, null, 2));

          const lines = [
            '# Business Zero production load test',
            '',
            `Target: ${URL}`,
            '',
            '| Concurrent req/s | Requests | Error % | Avg ms | p95 ms | p99 ms | Achieved RPS |',
            '|---:|---:|---:|---:|---:|---:|---:|',
            ...report.stages.map(r => `| ${r.concurrency} | ${r.requests} | ${(r.errorRate*100).toFixed(2)} | ${r.avgMs==null?'—':r.avgMs.toFixed(0)} | ${r.p95Ms==null?'—':r.p95Ms.toFixed(0)} | ${r.p99Ms==null?'—':r.p99Ms.toFixed(0)} | ${r.achievedRps.toFixed(1)} |`),
            '',
            stoppedEarly ? 'Stopped automatically after a safety threshold was exceeded.' : 'All configured stages completed within safety thresholds.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload load test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-zero-load-test-report
          path: load-test-report.json
          if-no-files-found: warn
