name: Business Zero v5.6.1 live verification
on:
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend v5.6.1 and Telegram menu
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 72); do
            body="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health || true)"
            menu="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health/menu || true)"
            echo "$body"
            echo "$menu"
            if grep -q 'business-zero-v5.6.1' <<<"$body" && grep -q '"miniAppBuild":561' <<<"$body" && grep -q 'v561.html?build=561' <<<"$menu"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Verify v561 bootstrap and transformed document
        shell: bash
        run: |
          set -euo pipefail
          boot="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/v561.html?build=561&smoke=1')"
          grep -q 'Загрузка версии 5.6.1' <<<"$boot"
          grep -q 'fetch(`./?source=561-' <<<"$boot"
          root="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/?source=561-smoke')"
          grep -q 'BUSINESS GAME · 5.6' <<<"$root"
          python - <<'PY'
          import urllib.request,re
          url='https://stefasg18.github.io/business-zero-/?source=561-python'
          html=urllib.request.urlopen(url,timeout=15).read().decode()
          html=re.sub(r'\s*<script\s+defer\s+src="ios-render-recovery-v551\.js\?v=560"></script>','',html,flags=re.I)
          html=html.replace('?v=560','?v=561').replace('Бизнес с нуля 5.6','Бизнес с нуля 5.6.1').replace('BUSINESS GAME · 5.6','BUSINESS GAME · 5.6.1')
          html=html.replace('</head>','  <script defer src="safe-overlay-v561.js?v=561"></script>\n</head>')
          assert 'ios-render-recovery-v551.js?v=560' not in html
          assert 'BUSINESS GAME · 5.6.1' in html
          assert 'config.js?v=561' in html
          assert 'cosmetic-access-v52.js?v=561' in html
          assert 'safe-overlay-v561.js?v=561' in html
          print('transform ok')
          PY
      - name: Verify fresh critical assets
        run: |
          set -euo pipefail
          for f in config.js cosmetic-access-v52.js version-guard-v56.js safe-overlay-v561.js app.js game-v50.js party-arena-v55.js; do
            curl -fsS --max-time 15 "https://stefasg18.github.io/business-zero-/$f?v=561" >/dev/null
          done
