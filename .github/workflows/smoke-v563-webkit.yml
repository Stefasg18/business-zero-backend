name: Business Zero v5.6.3 WebKit smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend and Telegram menu
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 72); do
            h="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health || true)"
            m="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health/menu || true)"
            echo "$h"
            echo "$m"
            if grep -q 'business-zero-v5.6.3' <<<"$h" && grep -q '"miniAppBuild":563' <<<"$h" && grep -q 'v563.html?build=563' <<<"$m"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Verify v563 bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/v563.html?build=563&smoke=1')"
          grep -q 'Запуск 5.6.3' <<<"$html"
          grep -q '__BZ_PARTY_ARENA_V55__=true' <<<"$html"
          grep -q 'Получаю свежий интерфейс' <<<"$html"
          ! grep -q 'document.write' <<<"$html"
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null
      - name: Open live app in iPhone-like WebKit
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const browser = await webkit.launch({headless:true});
          const ctx = await browser.newContext({...devices['iPhone 13']});
          const page = await ctx.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e.message||e)));
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
          await page.goto('https://stefasg18.github.io/business-zero-/v563.html?build=563&webkit=2',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(15000);
          const result=await page.evaluate(()=>({
            title:document.title,
            app:!!document.querySelector('.app'),
            home:!!document.querySelector('#tab-home'),
            top:(document.querySelector('.topbar .eyebrow')?.textContent||'').trim(),
            display:document.querySelector('.app')?getComputedStyle(document.querySelector('.app')).display:null,
            text:(document.body.innerText||'').slice(0,500),
            boot:(document.querySelector('#bzBoot563Text')?.textContent||'').trim()
          }));
          console.log(JSON.stringify({result,errors:errors.slice(0,12)},null,2));
          if(!result.app || !result.home || result.display==='none') process.exit(2);
          if(!result.text.includes('Бизнес с нуля')) process.exit(3);
          if(result.boot.startsWith('Ошибка запуска')) process.exit(4);
          await page.screenshot({path:'v563.png',fullPage:false});
          await browser.close();
          JS
          node check.mjs
