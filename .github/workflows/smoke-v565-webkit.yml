name: Business Zero v5.6.5 WebKit smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for backend and Telegram menu
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 72); do
            h="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health || true)"
            m="$(curl -fsS --max-time 15 https://business-zero-backend.onrender.com/health/menu || true)"
            echo "$h"
            echo "$m"
            if grep -q 'business-zero-v5.6.5' <<<"$h" && grep -q '"miniAppBuild":565' <<<"$h" && grep -q 'v565.html?build=565' <<<"$m"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Wait for v565 Pages files
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://stefasg18.github.io/business-zero-/v565.html?build=565&smoke=1'
            'https://stefasg18.github.io/business-zero-/boot-v565.js?v=5651&smoke=1'
            'https://stefasg18.github.io/business-zero-/runtime-guard-v565.js?v=5651&smoke=1'
            'https://stefasg18.github.io/business-zero-/stability-v372.js?v=5651&smoke=1'
          )
          for url in "${urls[@]}"; do
            ok=0
            for i in $(seq 1 36); do
              code="$(curl -L -sS -o /tmp/page.out -w '%{http_code}' --max-time 15 "$url" || true)"
              echo "$code $url"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1
          done
      - name: Verify v565 source
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/v565.html?build=565&smoke=1')"
          boot="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/boot-v565.js?v=5651&smoke=1')"
          guard="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/runtime-guard-v565.js?v=5651&smoke=1')"
          stability="$(curl -fsS --max-time 15 'https://stefasg18.github.io/business-zero-/stability-v372.js?v=5651&smoke=1')"
          grep -q 'Запуск 5.6.5' <<<"$html"
          grep -q 'waitForTelegramData' <<<"$boot"
          grep -q 'runtime-guard-v565.js' <<<"$boot"
          grep -q "VERSION='5.6.5'" <<<"$guard"
          ! grep -q "VERSION = '3.7.2'" <<<"$stability"
      - name: Install Playwright WebKit
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps webkit >/dev/null
      - name: Open live app in iPhone-like WebKit
        shell: bash
        run: |
          cat > check.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const browser=await webkit.launch({headless:true});
          const ctx=await browser.newContext({...devices['iPhone 13']});
          const page=await ctx.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e.message||e)));
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          await page.goto('https://stefasg18.github.io/business-zero-/v565.html?build=565&webkit=1',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(22000);
          const result=await page.evaluate(()=>({
            title:document.title,
            app:!!document.querySelector('.app'),
            home:!!document.querySelector('#tab-home'),
            display:document.querySelector('.app')?getComputedStyle(document.querySelector('.app')).display:null,
            top:(document.querySelector('.topbar .eyebrow')?.textContent||'').trim(),
            mode:(document.querySelector('#modeBadge')?.textContent||'').trim(),
            boot:(document.querySelector('#bzBoot565Text')?.textContent||'').trim(),
            bootOpacity:document.querySelector('#bzBoot565')?getComputedStyle(document.querySelector('#bzBoot565')).opacity:null,
            guard:Boolean(window.__BZ_RUNTIME_GUARD_V565__),
            oldRaceGuard:Boolean(window.__BZ_RACING_DIRECTION_V532__)
          }));
          console.log(JSON.stringify({result,errors:errors.slice(0,12)},null,2));
          if(!result.app||!result.home||result.display==='none')process.exit(2);
          if(result.top!=='BUSINESS GAME · 5.6.5')process.exit(3);
          if(!result.guard)process.exit(4);
          if(result.oldRaceGuard)process.exit(5);
          if(!result.boot.startsWith('Готово'))process.exit(6);
          await browser.close();
          JS
          node check.mjs
